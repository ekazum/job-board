# Relative paths are resolved against this file's folder.
db_path: data/job_board.db

# The job-title keywords (wanted and excluded roles) and the location are set in the Profile view.

# LLM used to score postings. Switching provider is this one line (or the Settings view's drop-down).
llm:
  provider: ollama          # ollama | groq | github | anthropic | openai
  model: qwen2.5:7b         # a provider entry can override it with its own model:
  threshold: 6              # a fit below this shows as low on the card; the score never moves a card
  max_text_chars: 3000
  request_timeout_s: 120
  max_retries: 1            # one retry on 429/5xx (honouring Retry-After) or a dropped connection

# The chat window's model (the Chat button). provider names one of the providers below; ollama runs it on this PC.
chat:
  provider: ollama
  model: qwen2.5:7b
  num_ctx: 8192             # Ollama only: the model's context window in tokens (prompt, tools and history must fit)
  max_steps: 12             # model and tool steps per answer
  history_tokens: 3000      # how much of the earlier conversation is sent with each message

# OpenAI-compatible endpoints. API keys come from .env (api_key_env names the variable; NONE = no key, a dummy is
# sent). concurrency: requests in flight (1 for a local CPU model). json_mode: send response_format=json_object.
providers:
  ollama:    {base_url: http://localhost:11434/v1, api_key_env: NONE, concurrency: 1, json_mode: true}
  groq:      {base_url: https://api.groq.com/openai/v1, api_key_env: GROQ_API_KEY, concurrency: 5}
  github:    {base_url: https://models.inference.ai.azure.com, api_key_env: GITHUB_TOKEN, concurrency: 5}
  anthropic: {base_url: https://api.anthropic.com/v1/, api_key_env: ANTHROPIC_API_KEY, concurrency: 5}
  openai:    {base_url: https://api.openai.com/v1, api_key_env: OPENAI_API_KEY, concurrency: 5}

# Companies to discover. domain is required; careers_url is optional and fetched before
