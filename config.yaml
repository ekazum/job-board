# Relative paths are resolved against this file's folder.
db_path: data/job_board.db

# Scan filter on job title + description: case-insensitive, whole-word.
# A job passes when it matches any include keyword and no exclude keyword; an empty include list keeps everything.
# Because descriptions are searched too, an exclude word mentioned anywhere in the text drops the job.
keywords:
  include:
    - reinforcement learning
    - LLM
    - agent
    - research scientist
    - AI researcher
    - machine learning
    - architect
    - R&D director
    - CTO
    - VP R&D
  exclude: [intern, student, junior]

# Companies to discover. domain is required; careers_url is optional and fetched before
# https://<domain>/careers, /jobs and /join-us. Edits apply on the next Discover/Scan, no restart needed.
# Companies added in the UI (with a domain) are discovered too; this list wins when both have the same name.
companies:
  - {name: Wix, domain: wix.com}
