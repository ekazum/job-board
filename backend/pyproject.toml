[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-board-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "anyio",
    "openai",
    "python-dotenv",
    "python-multipart",
    "pypdf",
    "python-docx",
    "geonamescache",
    # the chat window: a LangGraph agent whose tools are served over MCP
    "mcp",
    "langchain-core",
    "langchain-ollama",
    "langchain-openai",
    "langchain-mcp-adapters",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    # tests and type stubs, installed with the app so `pip install -e ./backend` is the whole setup
    "pytest",
    "httpx2",
    "types-pyyaml",
]

[tool.setuptools.packages.find]
include = ["job_board*"]

[tool.setuptools.package-data]
job_board = ["sql/*.sql", "sql/*/*.sql", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
